# GitHub secret scanning: paths that hold TEST-ONLY keys on purpose. Each file says so in its
# header or name; none protects anything real.
paths-ignore:
  # throwaway loopback TLS certificates of the team server tests
  - 'packages/sync/src/http/__fixtures__/*-test-only.key'
  # Ed25519 seeds of the golden journal fixtures (three fictional devices)
  - 'packages/schema/src/__fixtures__/journal/TEST-ONLY-KEYS.json'
