name: nightly installers

# Builds installers for Windows (NSIS, portable, Store MSIX) and macOS (dmg, zip).
# Signing and notarisation switch on only when the matching secrets exist; without them the
# artifacts are unsigned test builds. See docs/release/README.md for every variable.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  installers:
    name: installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Windows: .pfx (base64 or path), or Azure Artifact Signing, or a cloud HSM command.
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      WIN_SIGN_COMMAND: ${{ vars.WIN_SIGN_COMMAND }}
      AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT || secrets.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT || secrets.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE || secrets.AZURE_SIGN_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # Microsoft Store identity from Partner Center.
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      # macOS: Developer ID Application certificate (.p12, base64) and notarisation API key.
      CSC_LINK: ${{ matrix.os == 'macos-latest' && (secrets.MAC_CSC_LINK || secrets.CSC_LINK) || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && (secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD) || '' }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false

      - run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # The universal macOS app needs native addons for arm64 and x64 (see release.yml).
      - name: Install native addons for both macOS architectures
        if: runner.os == 'macOS'
        run: |
          printf '%s\n' 'supportedArchitectures:' '  os: [current]' '  cpu: [arm64, x64]' >> pnpm-workspace.yaml

      - run: pnpm install --frozen-lockfile

      - name: Write the App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      - name: Build installers
        run: pnpm -F @aio/desktop ${{ matrix.dist }}

      - name: Build Microsoft Store package
        if: runner.os == 'Windows'
        # Unsigned is expected: Microsoft signs Store submissions.
        run: node ../../tools/release/dist.mjs --win appx
        working-directory: apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msix
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          retention-days: 14
          if-no-files-found: error
