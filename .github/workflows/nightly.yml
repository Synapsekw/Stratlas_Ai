name: nightly installers

# Builds installers for Windows (NSIS, portable, Store MSIX) and macOS (dmg, zip).
# Signing and notarisation switch on only when the matching secrets exist; without them the
# artifacts are unsigned test builds. See docs/release/README.md for every variable.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  installers:
    name: installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Windows: .pfx (base64 or path), or Azure Artifact Signing, or a cloud HSM command.
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      WIN_SIGN_COMMAND: ${{ vars.WIN_SIGN_COMMAND }}
      AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT || secrets.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT || secrets.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE || secrets.AZURE_SIGN_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # Microsoft Store identity from Partner Center.
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      # macOS: Developer ID Application certificate (.p12, base64) and notarisation API key.
      CSC_LINK: ${{ matrix.os == 'macos-latest' && (secrets.MAC_CSC_LINK || secrets.CSC_LINK) || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && (secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD) || '' }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false

      - run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # The universal macOS app needs native addons for arm64 and x64 (see release.yml).
      - name: Install native addons for both macOS architectures
        if: runner.os == 'macOS'
        run: |
          printf '%s\n' 'supportedArchitectures:' '  os: [current]' '  cpu: [arm64, x64]' >> pnpm-workspace.yaml

      - run: pnpm install --frozen-lockfile

      - name: Write the App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      # dist builds the demo project (tools/demo/build-demo.mjs): ffmpeg for its video and the
      # pipeline Python for its stockpile and road parts, then the client data check.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Pipeline runtime venv
        working-directory: python
        run: uv sync --frozen

      - name: Build installers
        run: pnpm -F @aio/desktop ${{ matrix.dist }}

      - name: Build Microsoft Store package
        if: runner.os == 'Windows'
        # Unsigned is expected: Microsoft signs Store submissions.
        run: node ../../tools/release/dist.mjs --win appx
        working-directory: apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msix
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          retention-days: 14
          if-no-files-found: error

  # The 1.0 checklist's stability and performance checks that are too slow for every merge: the
  # journal and merge budgets enforced, long fuzzing of every reader, kill-during-write with many
  # rounds (journal appends and the .bak included), and the renderer soak across the demos.
  stability:
    name: stability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      STRATLAS_BUDGETS: '1'
      STRATLAS_FUZZ_RUNS: '2000'
      STRATLAS_KILL_BAK: '1'
      STRATLAS_KILL_ROUNDS: '150'
      STRATLAS_SOAK: '1'
      STRATLAS_SOAK_CYCLES: '200'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Pipeline runtime venv
        working-directory: python
        run: uv sync --frozen

      - name: Journal and merge budgets (STRATLAS_BUDGETS)
        run: pnpm exec vitest run --retry=0 tools/release/budgets.test.mjs packages/merge/src/bench.test.ts

      - name: Fuzzing of every reader (STRATLAS_FUZZ_RUNS)
        run: pnpm exec vitest run --retry=0 tools/compat/fuzz.test.mjs packages/sync/src/exchange

      - name: Kill during writes and journal appends (STRATLAS_KILL_BAK, STRATLAS_KILL_ROUNDS)
        run: pnpm exec vitest run --retry=0 tools/compat/kill-write.test.mjs

      - run: pnpm -F @aio/desktop build

      - name: Demo projects for the soak
        run: pnpm demo:build --quick

      - name: Renderer soak across the demos (STRATLAS_SOAK, STRATLAS_SOAK_CYCLES)
        working-directory: apps/desktop
        run: pnpm exec playwright test e2e/soak.spec.ts --workers=1

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stability-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 7
