name: nightly installers

# Builds installers for Windows (NSIS, portable, Store MSIX) and macOS (dmg, zip).
#
# The nightly NEVER signs or notarises, even when signing secrets exist: it reads none of them,
# and QUADRION_NO_SIGNING=1 makes tools/release/brand-config.mjs drop any signing variable that
# might still reach it. Reason: a cloud HSM plan has a yearly signature quota (DigiCert KeyLocker:
# 1,000 a year; one Windows build uses 5), which a nightly would spend in a few months. Only
# release.yml, for a v* tag, signs. The artifacts are unsigned (Windows) or ad-hoc signed (macOS)
# test builds. See docs/release/SECRETS.md.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # Never sign here (see the top of this file). Do not add signing secrets to this workflow.
  QUADRION_NO_SIGNING: '1'

jobs:
  installers:
    name: installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # No signing secrets or variables (Windows or macOS) on purpose: see the top of this file.
      # Microsoft Store identity from Partner Center (public values, not signing).
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false

      - run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # The universal macOS app needs native addons for arm64 and x64 (see release.yml).
      - name: Install native addons for both macOS architectures
        if: runner.os == 'macOS'
        run: |
          printf '%s\n' 'supportedArchitectures:' '  os: [current]' '  cpu: [arm64, x64]' >> pnpm-workspace.yaml

      - run: pnpm install --frozen-lockfile

      # Fails the nightly if anything would sign, so a later edit cannot spend the quota unnoticed.
      - name: Check that nothing signs
        run: |
          summary="$(node tools/release/brand-config.mjs --summary)"
          echo "$summary"
          node tools/release/brand-config.mjs --route
          node -e 'const s = JSON.parse(process.argv[1]); if (s.win !== "unsigned" || s.mac !== "ad-hoc") { console.error("nightly must not sign"); process.exit(1); }' "$summary"

      # dist builds the demo project (tools/demo/build-demo.mjs): ffmpeg for its video and the
      # pipeline Python for its stockpile and road parts, then the client data check.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Pipeline runtime venv
        working-directory: python
        run: uv sync --frozen

      - name: Build installers
        run: pnpm -F @aio/desktop ${{ matrix.dist }}

      - name: Build Microsoft Store package
        if: runner.os == 'Windows'
        # Unsigned is expected: Microsoft signs Store submissions.
        run: node ../../tools/release/dist.mjs --win appx
        working-directory: apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msix
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          retention-days: 14
          if-no-files-found: error

  # The 1.0 checklist's stability and performance checks that are too slow for every merge: the
  # journal and merge budgets enforced, long fuzzing of every reader, kill-during-write with many
  # rounds (journal appends and the .bak included), and the renderer soak across the demos.
  stability:
    name: stability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      QUADRION_BUDGETS: '1'
      QUADRION_FUZZ_RUNS: '2000'
      QUADRION_KILL_BAK: '1'
      QUADRION_KILL_ROUNDS: '150'
      QUADRION_SOAK: '1'
      QUADRION_SOAK_CYCLES: '200'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Pipeline runtime venv
        working-directory: python
        run: uv sync --frozen

      - name: Journal and merge budgets (QUADRION_BUDGETS)
        run: pnpm exec vitest run --retry=0 tools/release/budgets.test.mjs packages/merge/src/bench.test.ts packages/journal/src/perf.test.ts

      - name: Fuzzing of every reader (QUADRION_FUZZ_RUNS)
        run: pnpm exec vitest run --retry=0 tools/compat/fuzz.test.mjs packages/sync/src/exchange

      - name: Kill during writes and journal appends (QUADRION_KILL_BAK, QUADRION_KILL_ROUNDS)
        run: pnpm exec vitest run --retry=0 tools/compat/kill-write.test.mjs

      - run: pnpm -F @aio/desktop build

      - name: Demo projects for the soak
        run: pnpm demo:build --quick

      - name: Renderer soak across the demos (QUADRION_SOAK, QUADRION_SOAK_CYCLES)
        working-directory: apps/desktop
        run: pnpm exec playwright test e2e/soak.spec.ts --workers=1

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stability-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 7
