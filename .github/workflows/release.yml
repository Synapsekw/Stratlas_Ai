name: release

# Release builds: signed Windows installers and Store package, a notarised universal macOS app,
# and the pipeline packs (Windows x64, macOS arm64 and Intel). Runs on a version tag (v*) and on demand.
#
# Every signing step switches on only when its secrets exist. Without them the same jobs still
# succeed and upload unsigned (Windows) or ad-hoc signed (macOS) test builds, so forks and a
# repository without certificates stay green. Artifacts only: nothing is published (the Store
# submission is manual, docs/release/STORE-SUBMISSION.md). Secret names: docs/release/SECRETS.md.
#
# Only a real release signs: a run for a `v*` tag (pushed, or "Run workflow" with the tag
# chosen). Any other run, such as "Run workflow" on a branch, sets QUADRION_NO_SIGNING and builds
# unsigned, because a cloud HSM plan has a yearly signature quota (DigiCert KeyLocker: 1,000; a
# release uses 5, SECRETS.md). nightly.yml never signs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # '1' unless this run builds a v* tag: tools/release/brand-config.mjs then drops every signing
  # variable (Windows and macOS) before electron-builder runs.
  QUADRION_NO_SIGNING: ${{ !(github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) && '1' || '0' }}

jobs:
  package-win:
    name: package (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # Routes, first match wins (windowsSigning in tools/release/brand-config.mjs): Azure Artifact
    # Signing, DigiCert KeyLocker, a .pfx, a custom WIN_SIGN_COMMAND. Exactly one is used: the
    # build drops the variables of the others, and the "Signing mode" step logs which one.
    # Only public settings live here. Signing secrets go to the steps that need them (route choice,
    # KeyLocker set-up, build), never to `pnpm install`, whose package scripts would see them.
    env:
      # Certificate subject CN; every signed exe is checked against it after the build.
      WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
      # A custom cloud HSM command template (for example SSL.com eSigner, SECRETS.md).
      WIN_SIGN_COMMAND: ${{ vars.WIN_SIGN_COMMAND }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false

      - run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Picks the route from which values exist and prints it (names only, never values).
      - name: Signing mode
        id: mode
        env:
          # Route A: Azure Artifact Signing. Account values may be repository variables or secrets.
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT || secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT || secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE || secrets.AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # Route B: DigiCert KeyLocker.
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
          # Route C: a certificate file (.pfx, base64).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          summary="$(node tools/release/brand-config.mjs --summary)"
          echo "$summary"
          win="$(node -p 'JSON.parse(process.argv[1]).win' "$summary")"
          node tools/release/brand-config.mjs --route
          if [ "$QUADRION_NO_SIGNING" = "1" ]; then
            echo "Not a v* tag: signing is off for this run (QUADRION_NO_SIGNING)."
          fi
          echo "win=$win" >> "$GITHUB_OUTPUT"
          echo "publisher=$(node -p 'JSON.parse(process.argv[1]).winPublisher' "$summary")" >> "$GITHUB_OUTPUT"

      # signtool.exe from the Windows SDK on the runner, for KeyLocker signing and the check below.
      - name: Locate signtool
        if: steps.mode.outputs.win != 'unsigned'
        shell: pwsh
        run: |
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object { try { [version]$_.Directory.Parent.Name } catch { [version]'0.0' } } |
            Select-Object -Last 1
          $kit = Get-Item 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\signtool.exe' -ErrorAction SilentlyContinue
          $signtool = if ($sdk) { $sdk.FullName } elseif ($kit) { $kit.FullName } else { throw 'signtool.exe not found' }
          Write-Host "signtool: $signtool"
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Route B, DigiCert KeyLocker, as DigiCert documents it for GitHub Actions:
      # https://docs.digicert.com/en/digicert-keylocker/ci-cd-integrations-and-deployment-pipelines/scripts/github/scripts-for-signing-using-ksp-library-on-github.html
      # (client certificate decoded to a .p12, KeyLocker tools msi, `smctl windows ksp list`,
      # `smctl windows certsync`; signing is `signtool sign /sha1 <thumbprint> ...`, see
      # tools/release/win-sign.mjs). Tool set-up and KSP:
      # https://knowledge.digicert.com/tutorials/configure-keylocker-for-microsoft-signtool
      # Nothing here prints a secret; the normalised thumbprint is masked as well.
      - name: Set up DigiCert KeyLocker
        if: steps.mode.outputs.win == 'keylocker'
        shell: pwsh
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: |
          $ErrorActionPreference = 'Stop'
          $thumbprint = ($env:SM_CODE_SIGNING_CERT_SHA1_HASH -replace '[\s:]', '').ToUpperInvariant()
          Write-Host "::add-mask::$thumbprint"
          if ($thumbprint -notmatch '^[0-9A-F]{40}$') { throw 'SM_CODE_SIGNING_CERT_SHA1_HASH is not a 40-character SHA-1 thumbprint' }

          # The client certificate, decoded into the runner's temp folder; removed by the last step.
          $p12 = Join-Path $env:RUNNER_TEMP 'keylocker-client.p12'
          [IO.File]::WriteAllBytes($p12, [Convert]::FromBase64String(($env:SM_CLIENT_CERT_FILE_B64 -replace '\s', '')))
          "SM_CLIENT_CERT_FILE=$p12" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:SM_CLIENT_CERT_FILE = $p12

          # KeyLocker client tools (smctl and the DigiCert KSP).
          $msi = Join-Path $env:RUNNER_TEMP 'Keylockertools-windows-x64.msi'
          Invoke-WebRequest -UseBasicParsing -OutFile $msi -Headers @{ 'x-api-key' = $env:SM_API_KEY } `
            -Uri 'https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download'
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/quiet', '/qn' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "KeyLocker tools install failed (msiexec $($install.ExitCode))" }
          $smctl = Get-ChildItem 'C:\Program Files\DigiCert' -Recurse -Filter smctl.exe | Select-Object -First 1
          if (-not $smctl) { throw 'smctl.exe not found after installing the KeyLocker tools' }
          $smctl.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          # The KSP must be registered and the certificate synced into the user store.
          & $smctl.FullName windows ksp list
          if ($LASTEXITCODE -ne 0) { throw "smctl windows ksp list failed ($LASTEXITCODE)" }
          & $smctl.FullName windows certsync
          if ($LASTEXITCODE -ne 0) { throw "smctl windows certsync failed ($LASTEXITCODE)" }
          $cert = Get-ChildItem Cert:\CurrentUser\My, Cert:\LocalMachine\My | Where-Object Thumbprint -eq $thumbprint | Select-Object -First 1
          if (-not $cert) { throw 'The code-signing certificate (SM_CODE_SIGNING_CERT_SHA1_HASH) is not in the store after certsync' }
          Write-Host "Code-signing certificate: $($cert.Subject), valid until $($cert.NotAfter.ToString('yyyy-MM-dd'))"

      - name: Build NSIS installer and portable exe (bundle check and packaged smoke test included)
        env:
          # The route "Signing mode" reported; dist.mjs fails if the build would pick another.
          EXPECTED_WIN_SIGNING: ${{ steps.mode.outputs.win }}
          WIN_SIGN_LOG: ${{ runner.temp }}/win-sign.log
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT || secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT || secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE || secrets.AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # KeyLocker: the KSP reads these; SM_CLIENT_CERT_FILE comes from the set-up step.
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm -F @aio/desktop dist:win

      # M10 decision 6: at most 15 MB over the 0.9.0 installers (CesiumJS and 3DTilesRendererJS).
      - name: Installer size budget
        run: node tools/release/budgets.mjs --installers apps/desktop/dist

      # Every exe in the installers and the unpacked app must pass `signtool verify /pa`, carry a
      # timestamp, and name the publisher: subject CN equal to WIN_PUBLISHER_NAME (default
      # signing.windowsPublisher in brand.json, else the company), and acceptable to the app's own
      # update check (ADR 0003). Any failure fails the release.
      - name: Verify Authenticode signatures and publisher
        if: steps.mode.outputs.win != 'unsigned'
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ steps.mode.outputs.publisher }}
        run: |
          $brand = Get-Content packages/brand/brand.json -Raw | ConvertFrom-Json
          $pinned = if ($brand.signing) { $brand.signing.windowsPublisher } else { $null }
          $files = @(Get-ChildItem apps/desktop/dist/*.exe) + @(Get-ChildItem apps/desktop/dist/win-unpacked -Recurse -Filter *.exe)
          $problems = @()
          foreach ($file in $files) {
            & $env:SIGNTOOL_PATH verify /pa /q $file.FullName
            if ($LASTEXITCODE -ne 0) { $problems += "$($file.Name): signtool verify /pa failed"; continue }
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $cn = $sig.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            $o = if ($sig.SignerCertificate.Subject -match '(?:^|,\s*)O="?([^",]+)') { $Matches[1] } else { '' }
            Write-Host ("{0,-8} {1}  {2}" -f $sig.Status, $cn, $file.FullName)
            if ($sig.Status -ne 'Valid') { $problems += "$($file.Name): status $($sig.Status)" }
            if (-not $sig.TimeStamperCertificate) { $problems += "$($file.Name): no timestamp" }
            if ($cn -cne $env:EXPECTED_PUBLISHER) { $problems += "$($file.Name): signer CN '$cn' is not WIN_PUBLISHER_NAME '$($env:EXPECTED_PUBLISHER)'" }
            if ($pinned -and $cn -cne $pinned -and $o -cne $pinned) { $problems += "$($file.Name): signer is not signing.windowsPublisher '$pinned' (brand.json); the app would refuse this update" }
            if (-not $pinned -and -not $cn.Contains($brand.company) -and -not $o.Contains($brand.company)) { $problems += "$($file.Name): signer CN/O does not name '$($brand.company)'; the app would refuse this update" }
          }
          $calls = if (Test-Path "$env:RUNNER_TEMP/win-sign.log") { @(Get-Content "$env:RUNNER_TEMP/win-sign.log").Count } else { 'n/a (signed by electron-builder itself)' }
          "Windows signing: $($files.Count) exe files signed and verified; sign hook calls: $calls" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($files.Count -eq 0) { throw 'No exe files found to verify' }
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; throw "$($problems.Count) signature problem(s)" }

      # Never leave the decoded client certificate on the runner, whatever happened above.
      - name: Remove the KeyLocker client certificate
        if: always()
        shell: pwsh
        run: |
          $p12 = Join-Path $env:RUNNER_TEMP 'keylocker-client.p12'
          if (Test-Path -LiteralPath $p12) { Remove-Item -LiteralPath $p12 -Force; Write-Host 'Removed the KeyLocker client certificate.' }

      - name: Build Microsoft Store package (unsigned; Microsoft signs Store submissions)
        working-directory: apps/desktop
        run: node ../../tools/release/dist.mjs --win appx

      - name: Checksums
        working-directory: apps/desktop/dist
        run: sha256sum *.exe *.msix > SHA256SUMS-windows.txt && cat SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.msix
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/SHA256SUMS-windows.txt
            apps/desktop/dist/stratlas-update.json
            apps/desktop/dist/*-user-guide.pdf
          retention-days: 30
          if-no-files-found: error

  package-mac:
    name: package (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # Developer ID Application certificate (.p12, base64) and its password.
      CSC_LINK: ${{ secrets.MAC_CSC_LINK || secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
      # Notarisation with an Apple ID and app-specific password ...
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # ... or with an App Store Connect API key (APPLE_API_KEY_P8 is written to a file below).
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-universal-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # A universal app carries native addons for arm64 and x64; pnpm installs only the host's
      # optional platform packages unless told otherwise (tools/release/mac-native.mjs checks).
      - name: Install native addons for both macOS architectures
        run: |
          printf '%s\n' 'supportedArchitectures:' '  os: [current]' '  cpu: [arm64, x64]' >> pnpm-workspace.yaml

      - run: pnpm install --frozen-lockfile

      - name: Write the App Store Connect API key
        if: env.QUADRION_NO_SIGNING != '1'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      - name: Signing mode
        id: mode
        run: |
          summary="$(node tools/release/brand-config.mjs --summary)"
          echo "$summary"
          if [ "$QUADRION_NO_SIGNING" = "1" ]; then
            echo "Not a v* tag: signing is off for this run (QUADRION_NO_SIGNING)."
          fi
          echo "mac=$(node -p 'JSON.parse(process.argv[1]).mac' "$summary")" >> "$GITHUB_OUTPUT"

      - name: Build universal dmg and zip (bundle check and packaged smoke test included)
        run: pnpm -F @aio/desktop dist:mac

      # M10 decision 6 (no 0.9.0 macOS baseline yet: the sizes are reported, not enforced).
      - name: Installer size budget
        run: node tools/release/budgets.mjs --installers apps/desktop/dist

      - name: Check the universal app
        working-directory: apps/desktop/dist
        run: |
          app="$(ls -d mac-universal/*.app | head -n 1)"
          exe="$app/Contents/MacOS/$(defaults read "$PWD/$app/Contents/Info" CFBundleExecutable)"
          archs="$(lipo -archs "$exe")"
          echo "$exe: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "not universal"; exit 1 ;; esac
          addons="$(find "$app" -name 'keyring.darwin-*.node' | wc -l | tr -d ' ')"
          echo "keyring addons: $addons"
          [ "$addons" -ge 2 ] || { echo "keyring addon missing for an architecture"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes' "$app/Contents/Info.plist"

      - name: Smoke test the Intel slice under Rosetta
        working-directory: apps/desktop
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            SMOKE_ARCH=x86_64 node ../../tools/release/smoke-packaged.mjs
          else
            echo "::warning::Rosetta is not available on this runner; the Intel slice was not started."
          fi

      - name: Verify signature, notarisation and stapling
        if: steps.mode.outputs.mac != 'ad-hoc'
        working-directory: apps/desktop/dist
        run: |
          app="$(ls -d mac-universal/*.app | head -n 1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "${{ steps.mode.outputs.mac }}" = "signed+notarised" ]; then
            spctl --assess --type execute --verbose "$app"
            for dmg in *.dmg; do xcrun stapler validate "$dmg"; done
          fi

      - name: Checksums
        working-directory: apps/desktop/dist
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/SHA256SUMS-macos.txt
            apps/desktop/dist/stratlas-update.json
          retention-days: 30
          if-no-files-found: error

  # Pipeline pack 0.4.0 from prebuilt parts only (founder decision of 8 Oct 2026): the locked
  # wheels, photogrammetry included (pycolmap, opencv-python-headless and pymeshlab on Windows x64
  # and macOS arm64; Intel macOS without them, decision 8), and conda-forge's PDAL on all three.
  # A few minutes per platform. The native licence report prints a summary and never fails; the
  # size budget of decision 6 (tools/release/budgets.mjs) still does.
  pipeline-pack:
    name: pipeline pack (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: win-x64
          - os: macos-15
            arch: macos-arm64
          - os: macos-15-intel
            arch: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # python-build-standalone CPython plus the locked wheels and conda-forge's PDAL; the script
      # smoke-tests the pack, prints the native licence report and checks the unpacked budget.
      - name: Build the pipeline pack
        run: node tools/pipeline-pack/build.mjs --out runtime

      # tar keeps the symlinks (bin/python3) and executable bits that a zip artifact would lose.
      - name: Archive
        working-directory: runtime
        run: |
          pack="$(ls -d pipeline-pack-* | head -n 1)"
          tar -czf "../$pack-${{ matrix.arch }}.tar.gz" "$pack"
          if command -v sha256sum >/dev/null; then sha256sum "../$pack-${{ matrix.arch }}.tar.gz"; else shasum -a 256 "../$pack-${{ matrix.arch }}.tar.gz"; fi

      - name: Size budget (decision 6)
        run: |
          pack="$(ls -d runtime/pipeline-pack-* | head -n 1)"
          node tools/release/budgets.mjs --pack "$pack" --archive "$(ls pipeline-pack-*-${{ matrix.arch }}.tar.gz)"

      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-pack-${{ matrix.arch }}
          path: pipeline-pack-*.tar.gz
          retention-days: 30
          if-no-files-found: error
