name: pack-native

# M10 G1: the pipeline pack's native components, built from pinned sources by
# tools/pipeline-pack/native/build-native.mjs for Windows x64 and macOS arm64 (decision 8):
# COLMAP 4.2.1 and pycolmap without CHOLMOD, LSD, CGAL, SiftGPU, CUDA or downloads; OpenCV without
# FFmpeg; the PDAL tool. Then the native licence gate (vcpkg SBOMs and every DLL, dylib and
# executable), the probes (pycolmap reports no CUDA and no CHOLMOD, OpenCV no FFmpeg) and a PDAL
# smoke test. Uploads `pack-native-<target>` for the callers (ci.yml, release.yml, nightly.yml).
#
# Caching: the build output is cached by the hash of the recipe, so a run with an unchanged recipe
# takes a few minutes; vcpkg's binary cache (files, in the Actions cache) keeps every built port
# between recipe changes. Cold: 1 to 2 hours per platform; ports cached: about 20 to 30 minutes.
# The binary cache is saved even when a later step fails, so a broken run still warms the next.
# Runner images are pinned (vcpkg builds can break on image updates).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: pack-native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win32-x64
          # macOS 14, as COLMAP's own wheels: Homebrew's libomp (bundled into pycolmap) is then
          # built for macOS 14, the oldest macOS the pack supports, not for the runner's newer one.
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # Builds the cp313 wheels (pycolmap, OpenCV); the pack runs CPython 3.13.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Short folders on Windows: vcpkg and MSBuild paths get deep.
      - name: Folders
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then base="C:/sn"; else base="$RUNNER_TEMP/sn"; fi
          mkdir -p "$base/bincache"
          {
            echo "NATIVE_OUT=$base/out"
            echo "NATIVE_WORK=$base/work"
            echo "VCPKG_BINCACHE=$base/bincache"
            echo "VCPKG_BINARY_SOURCES=clear;files,$base/bincache,readwrite"
            echo "VCPKG_DISABLE_METRICS=1"
          } >> "$GITHUB_ENV"

      - name: Restore the native build output (unchanged recipe)
        id: out
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NATIVE_OUT }}
          key: pack-native-out-${{ matrix.target }}-${{ hashFiles('tools/pipeline-pack/native/**/*.json', 'tools/pipeline-pack/native/**/*.cmake', 'tools/pipeline-pack/native/**/*.patch', 'tools/pipeline-pack/native/build-native.mjs') }}

      - name: Restore the vcpkg binary cache
        id: bin
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINCACHE }}
          key: vcpkg-bin-${{ matrix.target }}-${{ hashFiles('tools/pipeline-pack/native/**/vcpkg.json', 'tools/pipeline-pack/native/vcpkg-overlay/**', 'tools/pipeline-pack/native/components.json') }}
          restore-keys: vcpkg-bin-${{ matrix.target }}-

      - name: Build tools (macOS)
        if: steps.out.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install ninja libomp autoconf automake libtool

      - name: Build the native components
        if: steps.out.outputs.cache-hit != 'true'
        run: node tools/pipeline-pack/native/build-native.mjs --out "$NATIVE_OUT" --work "$NATIVE_WORK"

      - name: Save the vcpkg binary cache (also after a failed build)
        if: always() && steps.out.outputs.cache-hit != 'true' && steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINCACHE }}
          key: vcpkg-bin-${{ matrix.target }}-${{ hashFiles('tools/pipeline-pack/native/**/vcpkg.json', 'tools/pipeline-pack/native/vcpkg-overlay/**', 'tools/pipeline-pack/native/components.json') }}-${{ github.run_id }}

      - name: Save the native build output
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NATIVE_OUT }}
          key: ${{ steps.out.outputs.cache-primary-key }}

      # The wheels as the pack installs them, for the gate's file scan and the probes.
      - name: Probe environment with our wheels
        run: |
          python -m venv "$RUNNER_TEMP/probe"
          if [ "$RUNNER_OS" = "Windows" ]; then py="$RUNNER_TEMP/probe/Scripts/python.exe"; else py="$RUNNER_TEMP/probe/bin/python"; fi
          "$py" -m pip install --disable-pip-version-check numpy packaging pytest
          "$py" -m pip install --disable-pip-version-check --no-deps "$NATIVE_OUT"/wheels/*.whl
          echo "PROBE_PY=$py" >> "$GITHUB_ENV"

      - name: Native licence gate (SBOMs, components, wheels and tools)
        run: |
          node tools/release/native-licences.mjs --native "$NATIVE_OUT" \
            --scan "$RUNNER_TEMP/probe" --scan "$NATIVE_OUT" --json "$RUNNER_TEMP/native-gate.json"

      - name: pycolmap has no CUDA and no CHOLMOD, OpenCV no FFmpeg
        run: |
          "$PROBE_PY" -c "import pycolmap, cv2; print(pycolmap.__version__, pycolmap.COLMAP_build); print('OpenCV', cv2.__version__)"
          "$PROBE_PY" -m pytest -q --noconftest -p no:cacheprovider python/tests/test_licences.py -k "pycolmap or opencv"

      - name: PDAL runs
        run: |
          exe="$NATIVE_OUT/tools/pdal/bin/pdal"; [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --drivers | grep -E 'writers.copc|filters.smrf|writers.gdal'

      - name: PoissonRecon and SurfaceTrimmer reconstruct a sphere
        run: '"$PROBE_PY" tools/pipeline-pack/native/smoke_poissonrecon.py "$NATIVE_OUT/tools/poissonrecon/bin" "$RUNNER_TEMP/poisson"'

      - uses: actions/upload-artifact@v4
        with:
          name: pack-native-${{ matrix.target }}
          path: |
            ${{ env.NATIVE_OUT }}/wheels
            ${{ env.NATIVE_OUT }}/tools
            ${{ env.NATIVE_OUT }}/sbom
            ${{ env.NATIVE_OUT }}/native-manifest.json
          retention-days: 14
          if-no-files-found: error
