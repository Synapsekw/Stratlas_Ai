name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # macOS is parked (founder, 10 Oct 2026: Windows only for now). Its jobs are all still here:
      # this switch runs the unit tests, the e2e shards, the pipelines and the pack on macOS too.
      macos:
        description: Also run the macOS jobs (parked since 10 Oct 2026)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # A push to main is the fast-forward of a pull request that already ran this workflow on the very
  # same commit, so the run on main repeated it (18 min each for rounds 20 and 21 of 10 Oct 2026).
  # Such a push skips every job below. They run when the commit has no green pull request run into
  # main, when that cannot be read, and always for a pull request or "Run workflow".
  #
  # The gate also names the systems the jobs below run on: Windows, and macOS only when "Run
  # workflow" asks for it. On every pull request the macOS jobs took 10 to 13 min and then waited
  # for each other: GitHub runs five macOS jobs of an account at once, across all its runs, and
  # with three rounds in CI the last macOS shard waited 4.8 min for a runner (run 38059448343).
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      systems: ${{ steps.systems.outputs.systems }}
    steps:
      - name: Which systems?
        id: systems
        env:
          MACOS: ${{ inputs.macos }}
        run: |
          systems='["windows-latest"]'
          if [ "$MACOS" = true ]; then systems='["windows-latest", "macos-latest"]'; fi
          echo "systems=$systems" | tee -a "$GITHUB_OUTPUT"
      - name: Has this commit passed as a pull request into main?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        # main only moves forward, so a pull request into main that main was later fast-forwarded
        # to had main's commits already: the merge its run tested is the tree of this commit.
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # the newest pull requests into main, open or closed: the list does not wait for GitHub
            # to mark the one just fast-forwarded as merged
            pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&base=main&sort=updated&direction=desc&per_page=50" \
              --jq "[.[] | select(.head.sha == \"$GITHUB_SHA\")][0].html_url // empty") || pull=
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=pull_request&status=success&per_page=1" \
              --jq '.workflow_runs[0].html_url // empty') || green=
            if [ -n "$pull" ] && [ -n "$green" ]; then
              run=false
              echo "Every job is skipped: this commit passed as $pull in $green." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Lint, format and types give the same answer on every OS, so they run once, on Linux, in a job
  # each. On the Windows runner they were 10 of the check job's 15 min (lint 495 s in 63 ESLint
  # processes one after another, format 45 s, types 62 s; run 38047000052).
  static:
    name: ${{ matrix.task }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: [lint, 'format:check', typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The runner has 4 cores and 16 GB; tools/lint.mjs would use half the cores.
      QUADRION_LINT_JOBS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # Scripts are not needed to read the sources (skips the Electron download).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm ${{ matrix.task }}

  # The unit tests, on both systems the product ships for. The e2e suite runs beside them in its
  # own jobs (below): one job doing both took 31 min on the Windows runner (lint 8, unit tests 3,
  # e2e 14) and was cancelled at its 30 min limit (run 37582837137).
  unit:
    name: unit tests (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    # the tests took 208 s on Windows and 153 s on macOS (run 38047000052), after about 80 s of set-up
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false

      - name: Enable pnpm (version from packageManager)
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The importers (and their tests) make thumbnails, textures and video proxies with ffmpeg.
      - uses: ./.github/actions/ffmpeg
      # Electron fetches its binary lazily on first launch; parallel e2e workers would race.
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - run: pnpm test

  # The Playwright + Electron suite in shards, each on one worker (playwright.config.ts: several
  # Electron windows with WebGL compete for the runner's software GPU). tools/ci/e2e-shards.mjs
  # splits the spec files by how long each takes, so the shards end together: Playwright's own
  # --shard goes by test count, and of three shards on macOS the first ran 10.7 min of tests and
  # the second 4.6 (run 38051445110). Six shards for 25 min of tests on Windows: with five, a
  # shard took up to 10.5 min, of which 2 min is the demo build (run 38061603126). macOS, when it
  # is asked for, gets the same six; they queue behind GitHub's five macOS jobs at once.
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.of }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.systems) }}
        shard: [1, 2, 3, 4, 5, 6]
        of: [6]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The demo project took 96 to 129 s of every shard to build (run 38047000052). The build reads
      # tools/demo, the workspace packages, the pipeline Python and the lockfiles, so the cache is
      # keyed by all of them and has no restore-keys: never an older demo. This step stays above
      # the installs, or the patterns would also match node_modules and the venv.
      # A cache saved by a pull request's run is only read by later runs of that pull request (a
      # re-run after a flaky test, a new push); other pull requests read the caches of main, and
      # main has this one only after a run there that the gate did not skip. So most first runs
      # build the demo.
      - name: Restore the demo project
        id: demo
        uses: actions/cache/restore@v4
        with:
          path: apps/desktop/demo
          key: demo-quick-${{ runner.os }}-${{ hashFiles('tools/demo/**', 'packages/**', 'python/**', 'pnpm-lock.yaml') }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false

      - name: Enable pnpm (version from packageManager)
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The importers make thumbnails, textures and video proxies with ffmpeg (as in the unit tests).
      - uses: ./.github/actions/ffmpeg
      # Electron fetches its binary lazily on first launch; parallel e2e workers would race.
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - run: pnpm -F @aio/desktop build

      # The Jobs panel e2e runs real pipelines in the development venv (python/.venv).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Pipeline runtime venv
        working-directory: python
        run: uv sync --frozen

      # M10: renders of the synthetic photo set (python/tests/photo_synth.py), keyed by its
      # source; the generator also keys its cache folders by the hash of its rendering code.
      - name: Cache photo set renders
        uses: actions/cache@v4
        with:
          path: python/.pytest_cache/d/photo-synth
          key: photo-synth-${{ runner.os }}-${{ hashFiles('python/tests/photo_synth.py') }}
          restore-keys: photo-synth-${{ runner.os }}-

      # The bundled demo project (synthetic data, tools/demo): built at CI speed and checked for
      # client data before anything is packaged; the first-start and guide-shots e2e open it.
      # It includes the photo processing demo (M10), rendered from the synthetic photo set.
      - name: Demo project (build and client data check)
        if: steps.demo.outputs.cache-hit != 'true'
        run: pnpm demo:build --quick
      # Saved here, not at the end of the job, so a failing test does not cost the next run the
      # build. The shards of one OS save the same key at once; the first one wins.
      - name: Save the demo project
        if: steps.demo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/desktop/demo
          key: ${{ steps.demo.outputs.cache-primary-key }}
      - name: Demo project from the cache (client data check)
        if: steps.demo.outputs.cache-hit == 'true'
        run: pnpm demo:check

      # Built above; no retries, and a test reported flaky fails the run (playwright.config.ts).
      # photo-real.spec.ts stays opt-in (QUADRION_E2E_PHOTO_REAL=1): its marking script does not
      # fit the real alignment yet; the pipelines job runs the real engines instead.
      # The shard's spec files come from tools/ci/e2e-shards.mjs (its test checks that the shards
      # of the matrix above hold every spec file once).
      - name: E2E (Playwright + Electron, zero-network guard, shard ${{ matrix.shard }}/${{ matrix.of }})
        working-directory: apps/desktop
        run: |
          files=$(node ../../tools/ci/e2e-shards.mjs --shard ${{ matrix.shard }}/${{ matrix.of }})
          pnpm exec playwright test $files

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}-shard${{ matrix.shard }}
          path: apps/desktop/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The pipeline Python as the pack has it: `uv sync` installs the prebuilt wheels (pycolmap,
  # opencv-python-headless and pymeshlab from PyPI, founder decision of 8 Oct 2026) and pdal.mjs
  # conda-forge's PDAL, so the real engines run here: COLMAP alignment, OpenCV's SGBM, MeshLab's
  # Poisson and PDAL's COPC, SMRF and reprojection. Nothing is compiled.
  #
  # On the Windows runner the suite took 18.5 min in one job, and it was the longest job of a run:
  # tests/test_photo_chain.py alone took 409 s there (101 s on macOS), the other photo tests 326 s
  # and the rest 374 s (run 38051445110). So the suite runs in those three parts, a job each
  # (6.0 to 6.9 min on Windows, run 38059448343).
  python:
    name: pipelines (${{ matrix.os }}, ${{ matrix.part }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.systems) }}
        part: [photo-chain, photo, rest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Sync the locked environment (CPython 3.13)
        run: uv sync --frozen
      # conda-forge's packages for PDAL, keyed by its lock (tools/pipeline-pack/pdal-lock.json)
      - name: Cache PDAL's conda packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/conda
          key: conda-pdal-${{ runner.os }}-${{ hashFiles('tools/pipeline-pack/pdal-lock.json') }}
      - name: PDAL (conda-forge, as in the pack)
        env:
          QUADRION_CONDA_ROOT: ${{ runner.temp }}/conda
        run: |
          node ../tools/pipeline-pack/pdal.mjs --out "$RUNNER_TEMP/pdal" | tee "$RUNNER_TEMP/pdal.log"
          grep '^AIO_PDAL=' "$RUNNER_TEMP/pdal.log" >> "$GITHUB_ENV"
      - name: Cache photo set renders
        uses: actions/cache@v4
        with:
          path: python/.pytest_cache/d/photo-synth
          key: photo-synth-${{ runner.os }}-${{ hashFiles('python/tests/photo_synth.py') }}
          restore-keys: photo-synth-${{ runner.os }}-
      # A report of the environment's native licences; it never fails (decision of 8 Oct 2026).
      - name: Native licence report
        run: node ../tools/release/native-licences.mjs --scan .venv
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      # One line per test as it runs (-vv, as pyproject.toml adds -q), so a stall names its test,
      # and the slowest tests at the end. A test over its pytest-timeout limit (300 s by default,
      # pyproject.toml) fails with the stacks of its threads.
      # The parts: the test files sit directly in python/tests (tools/ci/pytest-parts.test.mjs
      # checks that), so photo-chain, photo and rest together are every one of them.
      - name: Pytest (${{ matrix.part }})
        run: |
          case "${{ matrix.part }}" in
            photo-chain) tests=(tests/test_photo_chain.py) ;;
            photo) tests=($(ls tests/test_photo_*.py | grep -v '^tests/test_photo_chain\.py$')) ;;
            rest) tests=(tests "--ignore-glob=tests/test_photo_*.py") ;;
            *) echo "Unknown part ${{ matrix.part }}" >&2 && exit 1 ;;
          esac
          uv run --frozen pytest -vv -rfEs --durations=20 "${tests[@]}"
      - name: Entry point
        run: uv run --frozen python -m aio_pipelines --list

  # Which parts of the tree a push or pull request changed, for the jobs that only run when theirs did.
  changes:
    name: changes
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pack: ${{ steps.filter.outputs.pack }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pack:
              - 'tools/pipeline-pack/**'
              - 'python/pyproject.toml'
              - 'python/uv.lock'
              - 'python/src/aio_pipelines/photo/**'
              - '.github/workflows/ci.yml'

  # The pipeline pack as the nightly and the release build it, with its built-in smoke test (the
  # photogrammetry engines each in the process the product runs them in). Only when the pack's
  # build, its lock or the photo pipelines change: the nightly of 9 Oct 2026 caught two pack bugs
  # (GNU tar on the Windows runner, two libomp copies on macOS) that no PR job built. No archive or
  # extra tests here; the nightly and the release check the archive's budget.
  pack:
    name: pipeline pack (${{ matrix.os }})
    needs: [gate, changes]
    if: >-
      needs.gate.outputs.run == 'true' &&
      (needs.changes.outputs.pack == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gate.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    # a few minutes; the nightly's took about one on macOS
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Cache PDAL's conda packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/conda
          key: conda-pdal-${{ runner.os }}-${{ hashFiles('tools/pipeline-pack/pdal-lock.json') }}
      - name: Build the pipeline pack and smoke-test it
        env:
          QUADRION_CONDA_ROOT: ${{ runner.temp }}/conda
        run: node tools/pipeline-pack/build.mjs --out "$RUNNER_TEMP/runtime"

  licenses:
    name: licence check
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # Scripts are not needed to read licences (skips the Electron download).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Reports only since the founder decision of 8 Oct 2026: they warn and never fail.
      - name: Licence report (npm)
        run: pnpm license:check
      # M10 G1: the data sources of decision 4 (and pack metadata, once packs are built here).
      - name: Data licence report (imagery and terrain sources)
        run: node tools/release/data-licences.mjs

  # M9 T7: the Team Server (preview) on a real Postgres. Linux only; no image is built or pushed.
  team-server:
    name: team server (postgres)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aio
          POSTGRES_PASSWORD: aio-ci-only
          POSTGRES_DB: aio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aio -d aio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://aio:aio-ci-only@localhost:5432/aio
      PGPASSWORD: aio-ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # Scripts are not needed for the server (skips the Electron download).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Server suite on Postgres (every route, append-only tables, backup and restore)
        run: pnpm -F @aio/team-server test
      - name: Bundle, migrate an empty database, backup and restore drill
        working-directory: apps/team-server
        run: |
          pnpm build
          export AIO_DATA_DIR="$RUNNER_TEMP/aio-data" AIO_HOST=127.0.0.1
          node dist/main.mjs migrate
          node dist/main.mjs create-team --name "CI drill (synthetic)"
          node dist/main.mjs invite --role reviewer
          node dist/main.mjs backup --out "$RUNNER_TEMP/backup.jsonl"
          psql -h localhost -U aio -d aio -c 'CREATE DATABASE aio_restore'
          DATABASE_URL=postgres://aio:aio-ci-only@localhost:5432/aio_restore \
            node dist/main.mjs restore --in "$RUNNER_TEMP/backup.jsonl"
          psql -h localhost -U aio -d aio_restore -tAc "SELECT value FROM meta WHERE key = 'name'" \
            | grep -qx "CI drill (synthetic)"
      - name: Server licence report (GPL or AGPL in what the image ships; never fails)
        run: |
          pnpm licenses list --prod --json --filter @aio/team-server > "$RUNNER_TEMP/licences.json"
          node apps/team-server/scripts/licences.mjs "$RUNNER_TEMP/licences.json"
