name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # Lint, format, types and unit tests. The e2e suite runs beside it in its own jobs (below): one
  # job doing both took 31 min on the Windows runner (lint 8, unit tests 3, e2e 14) and was
  # cancelled at its 30 min limit (run 37582837137).
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # about 15 min on Windows, 11 on macOS
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false

      - name: Enable pnpm (version from packageManager)
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The importers (and their tests) make thumbnails, textures and video proxies with ffmpeg.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      # That action has no Apple silicon build. Homebrew's plain ffmpeg has no libwebp (the kit
      # importers write WebP tiles); ffmpeg-full has it but is keg-only, so put it on the PATH.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: ffmpeg encodes WebP
        run: ffmpeg -hide_banner -encoders | grep -w libwebp
      # Electron fetches its binary lazily on first launch; parallel e2e workers would race.
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  # The Playwright + Electron suite in two shards per OS, each on one worker (playwright.config.ts:
  # several Electron windows with WebGL compete for the runner's software GPU). A shard is a
  # contiguous half of the spec files by test count; on the Windows runner the halves took about
  # 8.5 and 5 min of the 13.8 the whole suite took (run 37575692965), plus about 5 min of setup.
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false

      - name: Enable pnpm (version from packageManager)
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The importers make thumbnails, textures and video proxies with ffmpeg (as in check).
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: ffmpeg encodes WebP
        run: ffmpeg -hide_banner -encoders | grep -w libwebp
      # Electron fetches its binary lazily on first launch; parallel e2e workers would race.
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - run: pnpm -F @aio/desktop build

      # The Jobs panel e2e runs real pipelines in the development venv (python/.venv).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Pipeline runtime venv
        working-directory: python
        run: uv sync --frozen

      # The bundled demo project (synthetic data, tools/demo): built at CI speed and checked for
      # client data before anything is packaged; the first-start and guide-shots e2e open it.
      - name: Demo project (build and client data check)
        run: pnpm demo:build --quick

      # Built above; no retries, and a test reported flaky fails the run (playwright.config.ts).
      - name: E2E (Playwright + Electron, zero-network guard, shard ${{ matrix.shard }}/2)
        working-directory: apps/desktop
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}-shard${{ matrix.shard }}
          path: apps/desktop/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # M10 G1: our COLMAP/pycolmap, OpenCV and PDAL builds with the native licence gate
  # (.github/workflows/pack-native.yml). Rebuilt only when tools/pipeline-pack/native changes.
  pack-native:
    uses: ./.github/workflows/pack-native.yml

  python:
    name: pipelines (${{ matrix.os }})
    # The tests run against our own pycolmap and OpenCV wheels, never the PyPI ones (GPL CHOLMOD,
    # FFmpeg): pack-native builds them.
    needs: pack-native
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Sync the locked environment (CPython 3.13)
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: pack-native-${{ runner.os == 'Windows' && 'win32-x64' || 'darwin-arm64' }}
          path: pack-native
      - name: Our pycolmap and OpenCV wheels into the venv (outside uv.lock, as in the pack)
        run: uv pip install --no-deps ../pack-native/wheels/*.whl
      # Every DLL, dylib and executable of the pack's Python environment, with the wheels above.
      - name: Native licence gate on the pack's Python environment
        run: node ../tools/release/native-licences.mjs --scan .venv
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Pytest
        run: uv run --frozen pytest
      - name: Entry point
        run: uv run --frozen python -m aio_pipelines --list

  licenses:
    name: licence check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # Scripts are not needed to read licences (skips the Electron download).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Allow-list for shipped code, no GPL/AGPL anywhere
        run: pnpm license:check
      # M10 G1: the data sources of decision 4 (and pack metadata, once packs are built here).
      - name: Data licences (imagery and terrain sources)
        run: node tools/release/data-licences.mjs

  # M9 T7: the Team Server (preview) on a real Postgres. Linux only; no image is built or pushed.
  team-server:
    name: team server (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aio
          POSTGRES_PASSWORD: aio-ci-only
          POSTGRES_DB: aio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aio -d aio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://aio:aio-ci-only@localhost:5432/aio
      PGPASSWORD: aio-ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # Scripts are not needed for the server (skips the Electron download).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Server suite on Postgres (every route, append-only tables, backup and restore)
        run: pnpm -F @aio/team-server test
      - name: Bundle, migrate an empty database, backup and restore drill
        working-directory: apps/team-server
        run: |
          pnpm build
          export AIO_DATA_DIR="$RUNNER_TEMP/aio-data" AIO_HOST=127.0.0.1
          node dist/main.mjs migrate
          node dist/main.mjs create-team --name "CI drill (synthetic)"
          node dist/main.mjs invite --role reviewer
          node dist/main.mjs backup --out "$RUNNER_TEMP/backup.jsonl"
          psql -h localhost -U aio -d aio -c 'CREATE DATABASE aio_restore'
          DATABASE_URL=postgres://aio:aio-ci-only@localhost:5432/aio_restore \
            node dist/main.mjs restore --in "$RUNNER_TEMP/backup.jsonl"
          psql -h localhost -U aio -d aio_restore -tAc "SELECT value FROM meta WHERE key = 'name'" \
            | grep -qx "CI drill (synthetic)"
      - name: Server licences (no GPL or AGPL in what the image ships)
        run: |
          pnpm licenses list --prod --json --filter @aio/team-server > "$RUNNER_TEMP/licences.json"
          node apps/team-server/scripts/licences.mjs "$RUNNER_TEMP/licences.json"
