name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false

      - name: Enable pnpm (version from packageManager)
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The importers (and their tests) make thumbnails, textures and video proxies with ffmpeg.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      # That action has no Apple silicon build. Homebrew's plain ffmpeg has no libwebp (the kit
      # importers write WebP tiles); ffmpeg-full has it but is keg-only, so put it on the PATH.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: ffmpeg encodes WebP
        run: ffmpeg -hide_banner -encoders | grep -w libwebp
      # Electron fetches its binary lazily on first launch; parallel e2e workers would race.
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -F @aio/desktop build

      # The Jobs panel e2e runs real pipelines in the development venv (python/.venv).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Pipeline runtime venv
        working-directory: python
        run: uv sync --frozen

      # The bundled demo project (synthetic data, tools/demo): built at CI speed and checked for
      # client data before anything is packaged; the first-start and guide-shots e2e open it.
      - name: Demo project (build and client data check)
        run: pnpm demo:build --quick

      - name: E2E (Playwright + Electron, zero-network guard)
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: apps/desktop/test-results/
          retention-days: 14
          if-no-files-found: ignore

  python:
    name: pipelines (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Sync the locked environment (CPython 3.13)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Pytest
        run: uv run --frozen pytest
      - name: Entry point
        run: uv run --frozen python -m aio_pipelines --list

  licenses:
    name: licence check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is enabled by corepack below; its store is cached explicitly.
          package-manager-cache: false
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # Scripts are not needed to read licences (skips the Electron download).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Allow-list for shipped code, no GPL/AGPL anywhere
        run: pnpm license:check
