[project]
name = "aio-pipelines"
version = "0.4.0"
description = "Quadrion AI pipeline pack: data pipelines run by the desktop app over JSON-RPC 2.0 on stdio."
requires-python = ">=3.13,<3.14"
license = "MIT"
# Founder decision of 8 Oct 2026 (ADR 0008, amended): the pack takes ready-made wheels, GPL parts
# included (pycolmap bundles CHOLMOD and SPQR, pymeshlab is GPL-3.0). THIRD-PARTY-NOTICES.md lists
# every one with its licence. The photogrammetry wheels are for Windows x64 and Apple silicon only
# (decision 8: the Intel Mac pack has no photogrammetry; pycolmap has no Intel Mac wheel).
dependencies = [
  "numpy>=2.1",
  "pillow>=11.0",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "scikit-image>=0.24",
  "rasterio>=1.4",
  "trimesh>=4.5",
  "rtree>=1.3",
  "shapely>=2.0",
  "pyshp>=2.3",
  "pyopf>=1.4.1,<2",
  # photogrammetry (M10): COLMAP's own wheels, OpenCV's headless wheels and MeshLab's screened
  # Poisson; one marker for all three, the platforms of decision 8
  "pycolmap==4.2.1; sys_platform == 'win32' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
  "opencv-python-headless==5.0.0.93; sys_platform == 'win32' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
  "pymeshlab==2025.7.post1; sys_platform == 'win32' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
aio-pipelines = "aio_pipelines.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aio_pipelines"]

[tool.uv]
# The pack runs CPython 3.13 from python-build-standalone; lock for Windows and macOS only.
environments = ["sys_platform == 'win32'", "sys_platform == 'darwin'"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Ported kit maths keeps the original short names (X0, Y1, R10) so it can be compared line by line.
"src/aio_pipelines/volumetric/process.py" = ["N806", "E741"]
"src/aio_pipelines/aik/*.py" = ["E741"]
"tests/*.py" = ["RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:skimage.*"]
