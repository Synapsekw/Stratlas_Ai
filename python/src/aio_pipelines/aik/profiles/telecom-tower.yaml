sides: {type: compass}
breakdowns: [class, zone, component]
ranking: {by: severity, n: 6, title: "Highest priority defects", sub: "Ordered by severity, then by size in the photo."}
coverage_label: "of photo"
facts: [severity, class, defect, height, zone, component, side, photo, captured, position, camera]
limits:
  - {title: "Visual only", text: "Findings describe what is visible in the photos. Torque, section loss and structural capacity are not measured."}
  - {title: "Draft, unvalidated", text: "Small or hidden defects can be missed. Every critical finding needs confirmation on site."}
  - {title: "Approximate positions", text: "Heights and faces come from estimated camera poses and the 3D model. They guide a climber; they are not surveyed."}
footer_disclaimer: "Visual inspection. Not a structural or load-capacity assessment."
detect_hints: |
  Check each leg, bracing member, platform, antenna mount, RRU, feeder/cable run, ladder and the base/foundation.
  Missing bolts show as empty holes or asymmetric bolt patterns. Antenna misalignment shows as tilt or twist relative
  to neighbours. Note bird nests on platforms. Box each defect tightly; one box per defect.
