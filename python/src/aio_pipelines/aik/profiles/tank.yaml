  - {id: shell, label: "Shell courses", from: 0.1, to: 0.9}
  - {id: bottom, label: "Bottom course / foundation", from: 0.0, to: 0.1}
sides: {type: compass}
breakdowns: [class, zone, component]
ranking: {by: coverage, n: 6, title: "Largest affected areas", sub: "Share of the photo covered by the finding."}
coverage_label: "of photo"
facts: [severity, class, defect, height, zone, component, side, coverage, photo, captured, position, camera]
limits:
  - {title: "Visual only", text: "Findings describe the visible surface. Wall thickness, pitting depth and fitness for service are not measured."}
  - {title: "Draft, unvalidated", text: "Findings under insulation or low-contrast coatings can be missed. Confirm before repair planning."}
  - {title: "Approximate positions", text: "Heights and bearings come from estimated camera poses and the 3D model; they are not surveyed."}
footer_disclaimer: "Visual inspection. Not an API 653 / fitness-for-service assessment."
detect_hints: |
  Scan each shell course band by band, the roof, wind girder, stairs, nozzles, manways and the chime/foundation
  ring. Staining that runs down from a seam suggests weeping. Box each defect; use the mask for large coating areas.
