# Vertical asset profile: storage tanks, silos, pressure vessels, columns.
id: tank
name: "Tank, silo or vessel"
asset_noun: tank
finding_noun: defects
assessment_title: "Tank visual inspection report"
finding_unit: region
placement: patch
overlay: both
classes:
