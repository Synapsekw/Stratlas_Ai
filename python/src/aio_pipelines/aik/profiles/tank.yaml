  - {id: 5, key: fitting, label: "Nozzle, stair, handrail or fitting damage", color: "#34a6d9"}
  - {id: 6, key: insulation, label: "Insulation or cladding damage", color: "#7cc46b"}
  - {id: 9, key: uncertain, label: "Uncertain, needs a closer look", uncertain: true, color: "#b68ef8"}
severity:
  - {level: 1, label: Minor, long: "Minor, monitor", color: "#fad34b", bg: "#fff4cc", fg: "#6b5100"}
  - {level: 2, label: Moderate, long: "Moderate, plan repair", color: "#ff7a2d", bg: "#ffe6d6", fg: "#8a3200"}
  - {level: 3, label: Severe, long: "Severe, inspect urgently", color: "#ee3f4b", bg: "#FFE5E5", fg: "#8c0010"}
