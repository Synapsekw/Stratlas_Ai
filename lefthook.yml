pre-commit:
  commands:
    lint-staged:
      run: pnpm exec lint-staged
commit-msg:
  commands:
    commitlint:
      # No {1}: lefthook wraps the command in sh -c "...", so a quoted path with spaces breaks on
      # Windows. Without an argument commitlint finds COMMIT_EDITMSG itself, worktrees included.
      run: pnpm exec commitlint --edit
