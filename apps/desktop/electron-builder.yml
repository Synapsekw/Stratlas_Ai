# Base packaging config for the desktop app.
#
# Product identity (productName, appId, executableName, copyright, Store identity) and the
# signing and notarisation switches are NOT set here. tools/release/brand-config.mjs reads
# @aio/brand and the environment and writes build/generated/electron-builder.json, which
# extends this file. Package with `pnpm -F @aio/desktop dist:win` (see docs/release/README.md).
# Never write the product name in this file; brand-config fails the build if you do.

directories:
  output: dist
  buildResources: build

# electron-vite bundles main, preload, renderer and every @aio/* workspace package into out/.
files:
  - out/**/*
  - package.json
  - '!out/**/*.map'
  - '!**/*.{test,spec}.{js,cjs,mjs,ts,tsx}'
  - '!**/{e2e,test,tests,__tests__}/**'
  # onnxruntime-node (local detection, BLD-10) ships every platform's binaries: keep this one's
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!**/node_modules/onnxruntime-node/script/**'

asar: true
# Native libraries load from disk, never from inside app.asar: the onnxruntime binding, its
# onnxruntime and DirectML DLLs (Windows) and dylib (macOS). The inference utility process loads them.
asarUnpack:
  - '**/node_modules/onnxruntime-node/bin/**'
compression: normal

# Shipped next to app.asar (process.resourcesPath):
#   demo/<project>/    optional demo projects listed in the library (apps/desktop/demo/).
# Map pack downloads need no external tool (main `packs/extract.ts`); the go-pmtiles CLI in
# tools/maps/bin is only for `tools/maps/build-packs.mjs` and is not packaged.
extraResources:
  - from: demo
    to: demo

# Electron fuses, flipped at package time (SPEC section 8, tech-evaluation section 1).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true

# Double-click a `.aio` project package to open it in the app (APP-5, BLD-9): the association
# (NSIS registry entries, MSIX uap:FileTypeAssociation, macOS document type) is written by
# tools/release/brand-config.mjs, since its name carries the brand. The path arrives in argv
# (Windows, Linux) or as `open-file` (macOS); a running instance gets it through the
# single-instance hand-off (src/main/index.ts).

# Windows: offline NSIS installer and portable exe; `dist:win:store` builds the MSIX for the Store.
win:
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # Signing economy (cloud HSM plans count signatures, DigiCert KeyLocker allows 1,000 a year):
  # one hash algorithm, so each file is signed once (the default sha1 + sha256 signs it twice);
  # and no `signExts`, so electron-builder signs only .exe files: the app exe, resources/elevate.exe,
  # the NSIS uninstaller, the setup exe and the portable exe, 5 per release. Electron's DLLs, the
  # Microsoft-signed onnxruntime and DirectML DLLs and the native .node addons are not re-signed.
  # docs/release/SECRETS.md has the count; a test keeps these two settings.
  signtoolOptions:
    rfc3161TimeStampServer: http://timestamp.digicert.com
    signingHashAlgorithms: [sha256]

nsis:
  oneClick: false
  # Per-user install without elevation; build/installer.nsh forces the per-user mode.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

# Microsoft Store (MSIX). Identity values come from STORE_* env vars (docs/release/README.md).
# Microsoft re-signs Store submissions, so this package does not need our certificate.
appx:
  # MSIX format; Partner Center takes .msix and .appx alike.
  artifactName: ${productName}-${version}-win-${arch}-store.msix
  capabilities: [runFullTrust]
  backgroundColor: '#11161C'
  showNameOnTiles: true
  languages: [en-US]
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0

# macOS: Developer ID signing with hardened runtime; notarisation is switched on by
# brand-config when Apple credentials are present.
mac:
  # One universal app (Apple silicon and Intel). electron-builder packs an x64 and an arm64 app
  # and merges them; every Mach-O file is lipo'd. The keyring addon ships one .node per arch in
  # its own package (both installed in CI, see release.yml), so the same file sits in both apps:
  # x64ArchFiles lets the merge keep it as is.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # onnxruntime-node ships an arm64 binary only (Intel Macs run without local detection, Settings
  # says so); the same file sits in both apps and is kept as is.
  x64ArchFiles: '**/node_modules/{@napi-rs/keyring-darwin-*,onnxruntime-node/bin}/**'
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/**'
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
